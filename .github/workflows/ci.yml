name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "fix/**", "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: docflow
          POSTGRES_USER: docflow
          # CI 전용 일회성 컨테이너의 비밀번호이며 실제 환경의 비밀정보가 아니다.
          POSTGRES_PASSWORD: docflow-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow -d docflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/docflow
      DB_USERNAME: docflow
      DB_PASSWORD: docflow-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # SPEC-05 미리보기: Office → PDF 실제 변환 테스트에 LibreOffice와 한글 글꼴이 필요하다 (ADR-0006, 결정 A4).
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress fonts-noto-cjk
          soffice --version
      # 변환 프로세스 네트워크 격리(unshare -rn)를 쓸 수 있으면 켠다. 쓸 수 없으면 경고를 남기고 격리 없이 테스트한다.
      - name: Enable preview network isolation
        run: |
          if ! unshare -rn true 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          if unshare -rn true 2>/dev/null; then
            echo "DOCFLOW_PREVIEW_LAUNCHER=unshare,-rn" >> "$GITHUB_ENV"
            echo "Preview isolation launcher enabled: unshare -rn"
          else
            echo "::warning::unshare -rn is not available on this runner; preview conversion tests run without OS network isolation"
          fi
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker images (build only, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t docflow-backend:ci backend
      - name: Build frontend image
        run: docker build --build-arg BACKEND_URL=http://backend:8080 -t docflow-frontend:ci frontend
      - name: Check images run as non-root and contain no .env
        run: |
          test "$(docker run --rm --entrypoint id docflow-frontend:ci -un)" = "node"
          docker run --rm --entrypoint sh docflow-backend:ci -c 'id docflow && test ! -e /app/.env && command -v pg_dump'
          docker run --rm --entrypoint sh docflow-frontend:ci -c 'test ! -e /app/.env'

  # 실제 backend 이미지를 임시 PostgreSQL 16·임시 볼륨과 함께 실행해 기동·Flyway·health·비root·볼륨 쓰기/읽기·
  # 재시작 후 유지를 확인한다(#45, docs/deployment.md §13). 기존 Docker 빌드 job과 병렬로 실행한다.
  backend-container:
    name: Backend container run (smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t docflow-backend:smoke backend
      - name: Run container smoke test
        run: scripts/ci/backend-container-smoke.sh docflow-backend:smoke

