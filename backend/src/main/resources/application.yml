spring:
  application:
    name: docflow
  config:
    # 저장소 루트의 .env(Git 미포함)를 선택적으로 읽는다. 실제 환경변수가 있으면 환경변수가 우선한다.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docflow}
    username: ${DB_USERNAME:docflow}
    password: ${DB_PASSWORD}
    hikari:
      # DB 장애 시 기본값(30초) 동안 대기하지 않고 빠르게 실패한다. (health DOWN 응답 지연 방지)
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway migration으로만 수행한다.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 업로드 파일 20MiB(20,971,520바이트), 요청 전체 21MiB (SPEC-03 §5.6, 결정 D2). 초과 시 413 FILE_TOO_LARGE.
      max-file-size: 20MB
      max-request-size: 21MB

docflow:
  auth:
    # 신뢰 프록시 수(#37). 0이면 X-Forwarded-For를 쓰지 않는다. 배포 구성을 확인한 뒤에만 설정한다(docs/deployment.md).
    trusted-proxy-hops: ${DOCFLOW_TRUSTED_PROXY_HOPS:0}
  bootstrap:
    # 최초 관리자 초대코드(24~64자, 비밀 변수). 사용자가 0명일 때만 쓰이며 원문은 저장·기록하지 않는다(#37).
    admin-code: ${DOCFLOW_BOOTSTRAP_ADMIN_CODE:}
  storage:
    # 문서 파일 저장 루트 (SPEC-03 §5.4). 기본값은 backend/에서 실행할 때 backend/storage이며 Git에서 제외한다.
    dir: ${DOCFLOW_STORAGE_DIR:./storage}
  # 버전 미리보기 (SPEC-05 §8.3, ADR-0006). Office 문서는 LibreOffice로 PDF 변환한다.
  preview:
    # LibreOffice 실행 파일. 비어 있으면 PATH의 soffice, Windows는 기본 설치 경로에서 찾는다.
    soffice-path: ${DOCFLOW_PREVIEW_SOFFICE_PATH:}
    # OS 격리 래퍼 인수(쉼표 구분, 예: unshare,-rn). 비어 있으면 OS 격리 없이 실행하고 시작 시 WARN 로그를 남긴다.
    # 지정했는데 점검에 실패하면 격리 없이 실행하지 않고 Office 미리보기를 끈다(503).
    launcher: ${DOCFLOW_PREVIEW_LAUNCHER:}
    timeout: 60s
    concurrency: 1
    queue-capacity: 10
    max-output-bytes: 100MB
    retry-after-failure: 10m
    cache:
      max-bytes: ${DOCFLOW_PREVIEW_CACHE_MAX_BYTES:2GB}
      max-idle: 30d
      cleanup-interval: 1h

management:
  endpoints:
    web:
      exposure:
        # health 외의 Actuator 엔드포인트는 HTTP로 노출하지 않는다.
        include: health
  endpoint:
    health:
      # 전체 상태(UP/DOWN)만 응답하고 구성 요소·DB 정보 등 상세 내용은 숨긴다.
      show-components: never
      show-details: never

server:
  servlet:
    session:
      # 서버 메모리 세션, 마지막 요청 후 30분 미사용 시 만료 (SPEC-AUTH §6.3)
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # 로컬(http://localhost)은 false, 운영(HTTPS)은 true로 설정한다.
        secure: ${SESSION_COOKIE_SECURE:false}
